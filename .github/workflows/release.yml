name: Release

# Triggered when you push a version tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build distribution zip
        run: |
          TAG=${GITHUB_REF_NAME}
          PKGNAME="paperlibrary-${TAG}"

          mkdir "$PKGNAME"
          cp -r paperlibrary requirements.txt .env.example README.md \
                start.bat start.sh "$PKGNAME/"

          # Ensure start.sh is executable inside the zip
          chmod +x "$PKGNAME/start.sh"

          zip -r "${PKGNAME}.zip" "$PKGNAME"
          echo "PKGNAME=$PKGNAME" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "paperlibrary $GITHUB_REF_NAME" \
            --generate-notes \
            "${PKGNAME}.zip"
